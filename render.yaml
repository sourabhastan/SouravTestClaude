databases:
  - name: talks-db
    plan: free
    databaseName: talks
    user: talks
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: talks-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: "npm install --include=dev && cd web && npm install --include=dev && npm run build"
    startCommand: "node server/src/index.js"
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talks-db
          property: connectionString
