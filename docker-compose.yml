services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talks
      POSTGRES_PASSWORD: talks
      POSTGRES_DB: talks
    ports:
      - "5432:5432"
    volumes:
      - talks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talks -d talks"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  talks_pgdata:
